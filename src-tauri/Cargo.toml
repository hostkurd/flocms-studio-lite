[package]
name = "flocms-studio"
version = "0.1.0"
description = "Desktop app to create, run and change FloCMS projects"
authors = ["HostKurd"]
license = "MIT"
repository = "https://github.com/hostkurd/flocms-studio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "flocms_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
